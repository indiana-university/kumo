name: Deploy Kumo docs site

on:
  # GitHub wikis don't trigger workflows in the parent repo when edited, so
  # poll on a schedule to pick up wiki changes. Adjust the cadence as needed.
  schedule:
    - cron: "0 * * * *" # hourly
  # Rebuild immediately when the sync script, branding, or workflow itself changes.
  push:
    branches: [master]
    paths:
      - "scripts/sync_wiki.ps1"
      - "branding/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Sync wiki content
        shell: pwsh
        run: ./scripts/sync_wiki.ps1

      - name: Build site
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
